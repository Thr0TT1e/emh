info:
  name: CreateAward
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}emh.v1.AwardAdminService/CreateAward"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Герой Советского Союза",
        "description": "Высшая степень отличия СССР",
        "imageUrl": "https://example.com/hero-ussr.png",
        "sortOrder": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
