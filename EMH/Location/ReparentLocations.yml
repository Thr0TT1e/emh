info:
  name: ReparentLocations
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}emh.v1.LocationAdminService/ReparentLocations"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "oldParentId": "<OLD_PARENT_ID>",
        "newParentId": "<NEW_PARENT_ID>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
