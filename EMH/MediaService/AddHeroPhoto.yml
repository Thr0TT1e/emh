info:
  name: AddHeroPhoto
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}emh.v1.HeroAdminService/AddHeroPhoto"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "heroId": "<HERO_UUID>",
        "url": "<publicUrl из ответа>",
        "description": "Загружено через presigned URL",
        "isMain": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
