// Административный сервис для управления справочником наград.

syntax = "proto3";

package emh.v1;

import "emh/v1/award.proto";
import "emh/v1/enums_emh.proto";
import "buf/validate/validate.proto";

option go_package = "codeberg.org/Thr0TT1e/emh/backend/internal/gen/emh/v1;emhv1";

// CreateAwardRequest данные для создания новой награды в справочнике.
message CreateAwardRequest {
  // name - официальное название награды (обязательно).
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // description - описание или статут награды.
  string description = 2;
  // image_url - URL загруженного изображения ленты или знака награды.
  string image_url = 3 [(buf.validate.field).string.uri = true];
  // sort_order - приоритет сортировки при отображении (старшие награды выше).
  int32 sort_order = 4 [(buf.validate.field).int32.gte = 0];
  // ribbon_image_url - URL изображения ленты награды для орденской планки.
  // Опционально: награду можно создать без загруженной ленты.
  string ribbon_image_url = 5 [
      (buf.validate.field).string.uri = true,
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // type - тип награды (орден, медаль, знак). Обязателен при создании.
  AwardType type = 6 [(buf.validate.field).enum.not_in = 0];
  // worn_without_bar - награда носится без колодки и не входит в блок планок.
  bool worn_without_bar = 7;
  // is_jubilee - признак юбилейной награды.
  bool is_jubilee = 8;
  // jurisdiction - государственная принадлежность награды (РФ, СССР, ведомственная).
  AwardJurisdiction jurisdiction = 9;
}

// CreateAwardResponse результат успешного создания награды.
message CreateAwardResponse {
  // id - UUID созданной награды.
  string id = 1;
}

// UpdateAwardRequest данные для частичного обновления существующей награды.
message UpdateAwardRequest {
  // id - UUID обновляемой награды (обязательно).
  string id = 1 [(buf.validate.field).string.uuid = true];
  // name - новое официальное название.
  string name = 2 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // description - новое описание или статут.
  string description = 3;
  // image_url - новый URL изображения награды.
  string image_url = 4 [
      (buf.validate.field).string.uri = true,
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // sort_order - новый приоритет сортировки.
  int32 sort_order = 5 [
      (buf.validate.field).int32.gte = 0,
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // field_mask - список полей для обновления. Позволяет отличить очистку поля от отсутствия изменений.
  repeated string field_mask = 6;
  // ribbon_image_url - новый URL изображения ленты награды. Пустое значение очищает ленту.
  string ribbon_image_url = 7 [
      (buf.validate.field).string.uri = true,
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // type - новый тип награды (орден, медаль, знак).
  AwardType type = 8 [
      (buf.validate.field).enum.not_in = 0,
      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // worn_without_bar - новый признак ношения без колодки.
  bool worn_without_bar = 9 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // is_jubilee - новый признак юбилейной награды.
  bool is_jubilee = 10 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // jurisdiction - новая государственная принадлежность награды.
  AwardJurisdiction jurisdiction = 11 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

// UpdateAwardResponse обновленный объект награды.
message UpdateAwardResponse {
  // award - актуальное состояние награды после обновления.
  Award award = 1;
}

// DeleteAwardRequest запрос на удаление награды из справочника.
message DeleteAwardRequest {
  // id - UUID удаляемой награды.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteAwardResponse подтверждение операции удаления.
message DeleteAwardResponse {
  // success - true если удаление прошло успешно.
  bool success = 1;
}

// AwardAdminService защищенный сервис для управления справочником наград.
service AwardAdminService {
  // CreateAward создает новую запись в справочнике наград.
  rpc CreateAward(CreateAwardRequest) returns (CreateAwardResponse);
  // UpdateAward частично обновляет существующую награду по field_mask.
  rpc UpdateAward(UpdateAwardRequest) returns (UpdateAwardResponse);
  // DeleteAward удаляет награду. При наличии связей с героями вернет ошибку.
  rpc DeleteAward(DeleteAwardRequest) returns (DeleteAwardResponse);
}
