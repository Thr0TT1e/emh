// Административный сервис управления карточками героев и их связями.
syntax = "proto3";

package emh.v1;

import "emh/v1/hero.proto";
import "emh/v1/enums_emh.proto";
import "emh/v1/common.proto";
import "buf/validate/validate.proto";

option go_package = "codeberg.org/Thr0TT1e/emh/backend/internal/gen/emh/v1;emhv1";

// CreateHeroRequest данные для создания карточки героя.
message CreateHeroRequest {
  // first_name - имя героя (обязательно).
  string first_name = 1 [(buf.validate.field).string.min_len = 1];
  // last_name - фамилия героя (обязательно).
  string last_name = 2 [(buf.validate.field).string.min_len = 1];
  // middle_name - отчество героя (опционально).
  string middle_name = 3;
  // short_bio - краткая биография для карточек в списках (до 500 символов).
  string short_bio = 4 [(buf.validate.field).string.max_len = 500];
  // full_bio - полная биография или рассказ о подвиге.
  string full_bio = 5;
  // rank - воинское звание на момент гибели или последнее звание.
  string rank = 6;
  // birth_date - дата рождения в формате YYYY-MM-DD.
  string birth_date = 7 [(buf.validate.field).string.pattern = "^(\\d{4}-\\d{2}-\\d{2}|)$"];
  // death_date - дата гибели в формате YYYY-MM-DD.
  string death_date = 8 [(buf.validate.field).string.pattern = "^(\\d{4}-\\d{2}-\\d{2}|)$"];
  // status - начальный статус публикации. По умолчанию DRAFT.
  PublicationStatus status = 9 [(buf.validate.field).enum.not_in = 0];
  // nickname - позывной или прозвище героя.
  string nickname = 10;
  // unit - подразделение или воинская часть.
  string unit = 11;
  // position - должность героя.
  string position = 12;
  // service_branch - ведомство или род войск.
  string service_branch = 13;
  // cause_of_death - причина и обстоятельства гибели.
  string cause_of_death = 14;
  // service_start_date - дата начала службы в формате YYYY-MM-DD.
  string service_start_date = 15 [(buf.validate.field).string.pattern = "^(\\d{4}-\\d{2}-\\d{2}|)$"];
  // memberships - членство в организациях и объединениях.
  repeated string memberships = 16;
  // birth_date_info - гибкая дата рождения.
  // Если заполнено, имеет приоритет над birth_date.
  FlexibleDate birth_date_info = 17;
  // death_date_info - гибкая дата гибели.
  // Если заполнено, имеет приоритет над death_date.
  FlexibleDate death_date_info = 18;
  // service_start_date_info - гибкая дата начала службы.
  // Если заполнено, имеет приоритет над service_start_date.
  FlexibleDate service_start_date_info = 19;
}

// CreateHeroResponse результат создания героя.
message CreateHeroResponse {
  // id - UUID созданной записи героя.
  string id = 1;
}

// UpdateHeroRequest запрос на частичное обновление данных героя.
message UpdateHeroRequest {
  // id - UUID обновляемого героя (обязательно).
  string id = 1 [(buf.validate.field).string.uuid = true];
  // first_name - новое имя. Игнорируется если пустое.
  string first_name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // last_name - новая фамилия. Игнорируется если пустое.
  string last_name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // middle_name - новое отчество.
  string middle_name = 4 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // short_bio - новая краткая биография.
  string short_bio = 5 [
    (buf.validate.field).string.max_len = 500,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // full_bio - новая полная биография.
  string full_bio = 6 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // rank - новое звание.
  string rank = 7 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // birth_date - новая дата рождения (строка).
  string birth_date = 8 [
    (buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // death_date - новая дата гибели (строка).
  string death_date = 9 [
    (buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // status - новый статус публикации.
  PublicationStatus status = 10 [
    (buf.validate.field).enum.not_in = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // field_mask - список полей для обновления.
  repeated string field_mask = 11;
  // nickname - новый позывной или прозвище.
  string nickname = 12 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // unit - новое подразделение или воинская часть.
  string unit = 13 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // position - новая должность.
  string position = 14 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // service_branch - новое ведомство или род войск.
  string service_branch = 15 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // cause_of_death - новая причина гибели.
  string cause_of_death = 16 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // service_start_date - новая дата начала службы.
  string service_start_date = 17 [
    (buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // memberships - новый список членства в организациях.
  repeated string memberships = 18;
  // birth_date_info - новая гибкая дата рождения.
  // Применяется, если указано в field_mask.
  FlexibleDate birth_date_info = 19 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // death_date_info - новая гибкая дата гибели.
  // Применяется, если указано в field_mask.
  FlexibleDate death_date_info = 20 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // service_start_date_info - новая гибкая дата начала службы.
  // Применяется, если указано в field_mask.
  FlexibleDate service_start_date_info = 21 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

// UpdateHeroResponse обновленная полная карточка героя.
message UpdateHeroResponse {
  // hero - актуальное состояние записи героя после обновления.
  HeroDetail hero = 1;
}

// DeleteHeroRequest запрос на удаление или архивацию героя.
message DeleteHeroRequest {
  // id - UUID героя.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // hard_delete - если true, запись удаляется физически.
  bool hard_delete = 2;
}

// DeleteHeroResponse результат операции удаления.
message DeleteHeroResponse {
  // success - true если операция выполнена успешно.
  bool success = 1;
}

// ListAdminHeroesRequest запрос на получение списка героев в админке.
message ListAdminHeroesRequest {
  // pagination - параметры пагинации.
  PaginationRequest pagination = 1;
  // search_query - поисковый запрос по ФИО.
  string search_query = 2;
  // status - фильтр по статусу. 0 (Unspecified) означает "не фильтровать строго" (см. include_archived).
  PublicationStatus status = 3;
  // include_archived - если true, включает архивные записи в общий список (работает при status=0).
  bool include_archived = 4;
}

// ListAdminHeroesResponse ответ со списком героев для админки.
message ListAdminHeroesResponse {
  // heroes - список кратких карточек героев.
  repeated HeroSummary heroes = 1;
  // pagination - метаданные для перехода к следующей странице.
  PaginationResponse pagination = 2;
}

// AddHeroAwardRequest запрос на привязку награды к герою.
message AddHeroAwardRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // award_id - UUID награды из справочника.
  string award_id = 2 [(buf.validate.field).string.uuid = true];
  // award_date - дата награждения (строка YYYY-MM-DD).
  string award_date = 3 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  // decree_number - номер приказа или указа о награждении.
  string decree_number = 4;
  // award_date_info - гибкая дата награждения.
  // Если заполнено, имеет приоритет над award_date.
  FlexibleDate award_date_info = 5;
  // devices - знаки повторности награды (звёздочки, цифры, дубовые листья).
  repeated AwardDevice devices = 6;
}

// RemoveHeroAwardRequest запрос на отвязку награды от героя.
message RemoveHeroAwardRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // award_id - UUID награды для удаления.
  string award_id = 2 [(buf.validate.field).string.uuid = true];
}

// AddHeroConflictRequest запрос на привязку конфликта к герою.
message AddHeroConflictRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // conflict_id - UUID конфликта из справочника.
  string conflict_id = 2 [(buf.validate.field).string.uuid = true];
  // specific_location - место боя или гибели в рамках данного конфликта.
  string specific_location = 3;
  // rank_at_conflict - звание героя на момент участия в данном конфликте.
  string rank_at_conflict = 4;
}

// RemoveHeroConflictRequest запрос на отвязку конфликта от героя.
message RemoveHeroConflictRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // conflict_id - UUID конфликта для удаления.
  string conflict_id = 2 [(buf.validate.field).string.uuid = true];
}

// AddHeroLocationRequest запрос на привязку локации к герою.
message AddHeroLocationRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // location_id - UUID локации из справочника.
  string location_id = 2 [(buf.validate.field).string.uuid = true];
  // type - тип связи (место рождения, гибели, захоронения, проживания).
  HeroLocationType type = 3 [(buf.validate.field).enum.not_in = 0];
}

// RemoveHeroLocationRequest запрос на отвязку локации от героя.
message RemoveHeroLocationRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // location_id - UUID локации для удаления.
  string location_id = 2 [(buf.validate.field).string.uuid = true];
  // type - тип удаляемой связи (часть составного первичного ключа).
  HeroLocationType type = 3 [(buf.validate.field).enum.not_in = 0];
}

// AddHeroPhotoRequest запрос на добавление фотографии в галерею героя.
message AddHeroPhotoRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // url - URL загруженного изображения в S3/MinIO.
  string url = 2 [(buf.validate.field).string.uri = true];
  // description - подпись к фотографии.
  string description = 3;
  // is_main - если true, фото становится главным.
  bool is_main = 4;
  // sort_order - позиция в галерее.
  int32 sort_order = 5;
  // face_box - область интереса для crop thumbnail (опционально).
  FaceBox face_box = 6;
}

// ReorderHeroPhotosRequest запрос на изменение порядка фотографий.
message ReorderHeroPhotosRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // photo_ids - упорядоченный список ID фотографий.
  repeated string photo_ids = 2 [(buf.validate.field).repeated.min_items = 1];
}

// NewPhoto элемент пакета загружаемых фотографий.
message NewPhoto {
  // url - URL загруженного изображения в S3/MinIO.
  string url = 1 [(buf.validate.field).string.uri = true];
  // description - подпись к фотографии.
  string description = 2;
  // is_main - если true, фото становится главным. При нескольких true в пакете главным становится первое.
  bool is_main = 3;
  // sort_order - позиция в галерее. Если 0, фото добавляется в конец.
  int32 sort_order = 4;
  // face_box - область интереса для crop thumbnail (опционально).
  FaceBox face_box = 5;
}

// AddedPhoto результат добавления одной фотографии с присвоенным ID.
message AddedPhoto {
  // id - UUID созданной фотографии.
  string id = 1;
  // url - URL изображения.
  string url = 2;
  // is_main - стало ли фото главным.
  bool is_main = 3;
}

// BatchAddHeroPhotosRequest запрос на пакетное добавление фотографий.
message BatchAddHeroPhotosRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // photos - список добавляемых фотографий (не более 50 за один запрос).
  repeated NewPhoto photos = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 50
  ];
}

// BatchAddHeroPhotosResponse результат пакетного добавления фотографий.
message BatchAddHeroPhotosResponse {
  // added - успешно добавленные фотографии с присвоенными ID.
  repeated AddedPhoto added = 1;
  // added_count - количество добавленных фотографий.
  int32 added_count = 2;
}

// DeleteHeroPhotosRequest запрос на пакетное удаление отмеченных фотографий.
message DeleteHeroPhotosRequest {
  // hero_id - UUID героя (для проверки принадлежности фотографий).
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // photo_ids - список UUID фотографий для удаления (отмеченные галочками).
  repeated string photo_ids = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 100
  ];
}

// DeleteHeroPhotosResponse результат пакетного удаления фотографий.
message DeleteHeroPhotosResponse {
  // deleted_count - количество фактически удалённых фотографий.
  int32 deleted_count = 1;
  // success - true если операция выполнена успешно.
  bool success = 2;
}

// AddHeroSourceRequest запрос на добавление источника данных к герою.
message AddHeroSourceRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // url - URL источника (статья, архив, публикация).
  string url = 2 [(buf.validate.field).string.uri = true];
  // title - заголовок источника.
  string title = 3;
  // source_type - тип источника (vk, website, archive, book).
  string source_type = 4;
  // excerpt - сохранённый фрагмент текста источника.
  string excerpt = 5;
}

// RemoveHeroSourceRequest запрос на удаление источника данных героя.
message RemoveHeroSourceRequest {
  // hero_id - UUID героя.
  string hero_id = 1 [(buf.validate.field).string.uuid = true];
  // source_id - UUID удаляемого источника.
  string source_id = 2 [(buf.validate.field).string.uuid = true];
}

// AddHeroRelationRequest запрос на создание связи между двумя героями.
message AddHeroRelationRequest {
  // from_hero_id - UUID героя-источника связи.
  string from_hero_id = 1 [(buf.validate.field).string.uuid = true];
  // to_hero_id - UUID героя-цели связи.
  string to_hero_id = 2 [(buf.validate.field).string.uuid = true];
  // relation_type - тип связи (father_son, comrade, commander).
  string relation_type = 3 [(buf.validate.field).string.min_len = 1];
  // description - описание связи.
  string description = 4;
}

// RemoveHeroRelationRequest запрос на удаление связи между героями.
message RemoveHeroRelationRequest {
  // id - UUID удаляемой связи.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// SetMainHeroPhotoRequest запрос на явное назначение главной фотографии героя.
message SetMainHeroPhotoRequest {
    // hero_id - UUID героя.
    string hero_id = 1 [(buf.validate.field).string.uuid = true];
    // photo_id - UUID фотографии, которую нужно сделать главной.
    string photo_id = 2 [(buf.validate.field).string.uuid = true];
}

// UpdateHeroPhotoRequest запрос на обновление метаданных фотографии.
message UpdateHeroPhotoRequest {
    // photo_id - UUID фотографии.
    string photo_id = 1 [(buf.validate.field).string.uuid = true];
    // hero_id - UUID героя (для проверки принадлежности).
    string hero_id = 2 [(buf.validate.field).string.uuid = true];
    // description - новая подпись к фотографии.
    string description = 3 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
    // face_box - новая область интереса для crop thumbnail.
    FaceBox face_box = 4;
    // field_mask - список полей для обновления (description, face_box).
    repeated string field_mask = 5;
}

// UpdateHeroPhotoResponse результат обновления фотографии.
message UpdateHeroPhotoResponse {
    // photo - обновлённая фотография.
    Photo photo = 1;
}

// HeroAdminService защищенный сервис для полного управления карточками героев.
service HeroAdminService {
  // CreateHero создает новую карточку героя со статусом DRAFT.
  rpc CreateHero(CreateHeroRequest) returns (CreateHeroResponse);
  // UpdateHero обновляет основные поля героя с поддержкой partial update.
  rpc UpdateHero(UpdateHeroRequest) returns (UpdateHeroResponse);
  // DeleteHero удаляет или архивирует карточку героя.
  rpc DeleteHero(DeleteHeroRequest) returns (DeleteHeroResponse);
  // AddHeroAward привязывает награду к герою. Возвращает подтверждение.
  rpc AddHeroAward(AddHeroAwardRequest) returns (AddHeroAwardRequest);
  // RemoveHeroAward удаляет связь героя с наградой.
  rpc RemoveHeroAward(RemoveHeroAwardRequest) returns (RemoveHeroAwardRequest);
  // AddHeroConflict привязывает конфликт к герою. Возвращает подтверждение.
  rpc AddHeroConflict(AddHeroConflictRequest) returns (AddHeroConflictRequest);
  // RemoveHeroConflict удаляет связь героя с конфликтом.
  rpc RemoveHeroConflict(RemoveHeroConflictRequest) returns (RemoveHeroConflictRequest);
  // AddHeroLocation привязывает локацию к герою с указанным типом связи.
  rpc AddHeroLocation(AddHeroLocationRequest) returns (AddHeroLocationRequest);
  // RemoveHeroLocation удаляет связь героя с локацией указанного типа.
  rpc RemoveHeroLocation(RemoveHeroLocationRequest) returns (RemoveHeroLocationRequest);
  // AddHeroPhoto добавляет фото в галерею героя.
  rpc AddHeroPhoto(AddHeroPhotoRequest) returns (AddHeroPhotoRequest);
  // ReorderHeroPhotos устанавливает новый порядок отображения фотографий.
  rpc ReorderHeroPhotos(ReorderHeroPhotosRequest) returns (ReorderHeroPhotosRequest);
  // BatchAddHeroPhotos добавляет несколько фотографий за один запрос.
  rpc BatchAddHeroPhotos(BatchAddHeroPhotosRequest) returns (BatchAddHeroPhotosResponse);
  // DeleteHeroPhotos удаляет отмеченные фотографии пакетно.
  rpc DeleteHeroPhotos(DeleteHeroPhotosRequest) returns (DeleteHeroPhotosResponse);
  // AddHeroSource добавляет источник данных к герою.
  rpc AddHeroSource(AddHeroSourceRequest) returns (AddHeroSourceRequest);
  // RemoveHeroSource удаляет источник данных героя.
  rpc RemoveHeroSource(RemoveHeroSourceRequest) returns (RemoveHeroSourceRequest);
  // AddHeroRelation создает связь между двумя героями.
  rpc AddHeroRelation(AddHeroRelationRequest) returns (AddHeroRelationRequest);
  // RemoveHeroRelation удаляет связь между героями.
  rpc RemoveHeroRelation(RemoveHeroRelationRequest) returns (RemoveHeroRelationRequest);
  // SetMainHeroPhoto назначает указанную фотографию главной для героя.
  // Триггер ensure_single_main_photo автоматически сбросит флаг у остальных.
  rpc SetMainHeroPhoto(SetMainHeroPhotoRequest) returns (SetMainHeroPhotoRequest);
  // UpdateHeroPhoto обновляет метаданные фотографии (описание, face_box).
  rpc UpdateHeroPhoto(UpdateHeroPhotoRequest) returns (UpdateHeroPhotoResponse);
  // ListHeroes возвращает список героев с поддержкой фильтрации по статусам для админки.
  rpc ListHeroes(ListAdminHeroesRequest) returns (ListAdminHeroesResponse);
}
